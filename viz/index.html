<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Tapestry — light from one to billions</title>
    <meta name="description" content="A self-calibrating historical simulation of the spread of Christianity, AD 30 to today, rendered as a luminous web of golden threads." />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>

      <header id="titlebar">
        <h1>The&nbsp;Tapestry</h1>
        <p class="subtitle">light from one to billions &middot; AD&nbsp;30&ndash;<span id="endyear">2025</span></p>
      </header>

      <div id="controls">
        <button id="play" title="Play / pause the time reveal">► Play</button>
        <input id="timeline" type="range" min="0" max="1000" value="1000" step="1" />
        <span id="yearlabel" class="yearlabel">2025</span>
        <button id="reset" title="Reset view">⟲ View</button>
        <button id="toggle-micro" title="Open the micro view: one life over time">A&nbsp;single&nbsp;life ›</button>
      </div>

      <div id="legend">
        <span class="dot seed"></span> Christ (the seed)
        <span class="dot apostolic"></span> apostolic journeys
        <span class="dot revival"></span> revival
        <span class="dot suppression"></span> suppression
        <span class="hint">scroll to zoom · drag to pan · click a thread</span>
      </div>

      <aside id="info" class="hidden"></aside>

      <section id="micro" class="hidden">
        <div class="micro-head">
          <h2>A single life</h2>
          <select id="micro-select"></select>
          <button id="micro-close" title="Back to the tapestry">✕</button>
        </div>
        <div id="micro-body"></div>
      </section>

      <div id="loading">kindling the threads…</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
